#
# Operator approval for the Stripe Link wallet tool. Credential-free: attaching
# it to a sandbox only adds an MCP allow rule for browserless_link_connect; the
# Browserless token still comes from the gated provider.
id: browserless-link-approve
display_name: Browserless Stripe Link wallet (approved)
description: Allows the browserless_link_connect MCP tool
category: other
endpoints:
  - host: mcp.browserless.io
    port: 443
    path: /mcp
    protocol: mcp
    enforcement: enforce
    rules:
      - allow: { method: tools/call, tool: browserless_link_connect }
binaries: [/usr/bin/node, /usr/local/bin/node, /usr/bin/curl, /usr/local/bin/curl]
