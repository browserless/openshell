#
# Browserless with Stripe Link behind human approval. Ordinary browsing works.
# The Stripe Link REST paths are not allowed, so an agent must request them
# through the OpenShell policy advisor and an operator must approve. The
# browserless_link_connect MCP tool is allowed only while the operator attaches
# the companion browserless-link-approve provider. browserless_link_checkout is
# always denied.
id: browserless-linkgated
display_name: Browserless (Stripe Link gated)
description: Browserless with Stripe Link behind human approval
category: other
credentials:
  - name: api_token
    description: Browserless API token, sent as the token query parameter
    env_vars: [BROWSERLESS_TOKEN]
    required: true
    auth_style: query
    query_param: token
  - name: mcp_token
    description: Browserless API token, sent as a bearer header to the MCP server
    env_vars: [BROWSERLESS_MCP_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token, mcp_token]
endpoints:
  - host: "production-*.browserless.io"
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/content" }
      - allow: { method: POST, path: "/chromium/bql" }
      - allow: { method: GET, path: "/json/**" }
  - { host: "production-*.browserless.io", port: 443, path: "/", protocol: websocket, access: read-write, enforcement: enforce }
  - host: mcp.browserless.io
    port: 443
    path: /mcp
    protocol: mcp
    enforcement: enforce
    rules:
      - allow: { method: initialize }
      - allow: { method: notifications/initialized }
      - allow: { method: tools/list }
      - allow: { method: tools/call, tool: browserless_smartscraper }
      - allow: { method: tools/call, tool: browserless_usage }
    deny_rules:
      - { method: tools/call, tool: browserless_link_checkout }
binaries: [/usr/bin/node, /usr/local/bin/node, /usr/bin/curl, /usr/local/bin/curl]
